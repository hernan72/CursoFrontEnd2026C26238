<body>
    <header>
        <img class="logo" src="./media/pelota.png" alt="Logo">
        <h1>Mundiales</h1>
        <nav>
            <ul>
                <li class="opciones" id="opcion1"> <a href="./index.html">Inicio</a> </li>

            </ul>

    <main>
    <br>    
    <span> Para contactarnos, dejanos tus datos</span><br><br>

    <form action="https://formspree.io/f/mvkzorqd" method="POST">
    <fieldset>
        <legend>Información personal</legend>
        <br>
        <label for="nombre">Nombre: </label>
        <input type="text" id="nombre" name="nombre" size="40" required>
    
        <label for="fnac">Fecha de nacimiento:</label>
        <input type="date" id="fnac" name="fnac" ><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" size="40" required><br><br>
    </fieldset><br>
    <fieldset>
        <legend>Detalle el mensaje</legend><br>
        <label for="asunto">Asunto:</label>  
        <input type="text" id="asunto" name="asunto"  required><br>  <br>
        
        <label for="mensaje">Mensaje:</label><br>
        <textarea id="mensaje" name="mensaje" rows="5" cols="40" placeholder="Escribí acá tu mensaje..."></textarea><br>
        <button type="submit">Enviar</button>
    </fieldset>
    </form>
    </main>

    <div class="seccion1">
        <div class="div-ft-redes">
